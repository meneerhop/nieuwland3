<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a6b38">
  <title>Wedstrijden — ASC Nieuwland 3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="wrap">
    <div class="pagina-header">
      <div>
        <div class="pagina-titel">Wedstrijden</div>
        <div class="pagina-ondertitel">ASC Nieuwland 3</div>
      </div>
    </div>

    <div class="tab-switcher">
      <button class="tab-switch-item actief" data-tab="aankomend">📅 Aankomend</button>
      <button class="tab-switch-item" data-tab="gespeeld">🏆 Gespeeld</button>
    </div>

    <div id="wedstrijd-lijst">
      <div class="skeleton skeleton-kaart"></div>
      <div class="skeleton skeleton-kaart"></div>
      <div class="skeleton skeleton-kaart"></div>
    </div>
  </div>

  <!-- ── Speler picker (boven uitslag modal) ── -->
  <div class="modal-overlay" id="speler-picker-modal" style="z-index:600">
    <div class="modal-sheet">
      <div class="modal-handel"></div>
      <div class="modal-hoofd">
        <div class="modal-titel" id="speler-picker-titel">Speler kiezen</div>
        <button class="modal-sluiten" id="speler-picker-sluiten">✕</button>
      </div>

      <div class="picker-invoer-blok">
        <div class="picker-minuut-rij">
          <span class="picker-min-label">Minuut</span>
          <input type="number" id="speler-picker-minuut" class="formulier-input picker-min-input"
            placeholder="bijv. 45" min="1" max="120">
        </div>
        <input type="search" id="speler-picker-zoek" class="formulier-input"
          placeholder="Zoeken op naam, positie of nummer…" autocomplete="off">
      </div>

      <div id="speler-picker-lijst"
        style="overflow-y:auto;max-height:52vh;padding:6px 0 env(safe-area-inset-bottom,16px)"></div>
    </div>
  </div>

  <!-- ── Uitslag invoer modal ── -->
  <div class="modal-overlay" id="uitslag-modal">
    <div class="modal-sheet">
      <div class="modal-handel"></div>
      <div class="modal-hoofd">
        <div class="modal-titel" id="uitslag-modal-titel">Uitslag</div>
        <button class="modal-sluiten" id="uitslag-modal-sluiten">✕</button>
      </div>

      <div class="modal-inhoud" style="padding-bottom:8px">

        <!-- Score -->
        <div class="uitslag-score-blok">
          <div class="uitslag-score-team">
            <div class="uitslag-score-naam">Nieuwland 3</div>
            <input type="number" id="uitslag-score-eigen"
              class="formulier-input uitslag-score-input" min="0" placeholder="0">
          </div>
          <div class="uitslag-score-scheider">–</div>
          <div class="uitslag-score-team">
            <div class="uitslag-score-naam" id="uitslag-tegenstander-label">Tegenstander</div>
            <input type="number" id="uitslag-score-tegenstander"
              class="formulier-input uitslag-score-input" min="0" placeholder="0">
          </div>
        </div>

        <!-- Timeline -->
        <div id="events-timeline"></div>

        <!-- Action buttons -->
        <div class="event-actie-balk">
          <button class="event-actie-btn" data-type="doel">
            <div class="event-actie-cirkel cirkel-doel">⚽</div>
            <span class="event-actie-label">Doel</span>
          </button>
          <button class="event-actie-btn" data-type="geel">
            <div class="event-actie-cirkel cirkel-geel">
              <span class="kaart-icon geel"></span>
            </div>
            <span class="event-actie-label">Geel</span>
          </button>
          <button class="event-actie-btn" data-type="rood">
            <div class="event-actie-cirkel cirkel-rood">
              <span class="kaart-icon rood"></span>
            </div>
            <span class="event-actie-label">Rood</span>
          </button>
          <button class="event-actie-btn" data-type="blessure">
            <div class="event-actie-cirkel cirkel-blessure">🩹</div>
            <span class="event-actie-label">Blessure</span>
          </button>
        </div>

        <div id="uitslag-fout"
          style="color:var(--rood);font-size:13px;font-weight:600;min-height:16px;text-align:center;margin-top:4px"></div>
      </div>

      <div class="modal-voet">
        <button class="btn btn-primair w-full" id="uitslag-opslaan-btn">Opslaan</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>controleerAuth();</script>
  <script src="js/nav.js"></script>
  <script src="js/wedstrijden.js"></script>
</body>
</html>
