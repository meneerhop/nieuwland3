<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a6b38">
  <title>Wedstrijden — ASC Nieuwland 3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="wrap">
    <div class="pagina-header">
      <div>
        <div class="pagina-titel">Wedstrijden</div>
        <div class="pagina-ondertitel">ASC Nieuwland 3</div>
      </div>
    </div>

    <!-- Tab switcher -->
    <div class="tab-switcher">
      <button class="tab-switch-item actief" data-tab="aankomend">📅 Aankomend</button>
      <button class="tab-switch-item" data-tab="gespeeld">🏆 Gespeeld</button>
    </div>

    <!-- Wedstrijd lijst -->
    <div id="wedstrijd-lijst">
      <div class="skeleton skeleton-kaart"></div>
      <div class="skeleton skeleton-kaart"></div>
      <div class="skeleton skeleton-kaart"></div>
    </div>
  </div>

  <!-- Uitslag invoer modal -->
  <div class="modal-overlay" id="uitslag-modal">
    <div class="modal-sheet">
      <div class="modal-handel"></div>
      <div class="modal-hoofd">
        <div class="modal-titel" id="uitslag-modal-titel">Uitslag invoeren</div>
        <button class="modal-sluiten" id="uitslag-modal-sluiten">✕</button>
      </div>
      <div class="modal-inhoud">

        <!-- Score -->
        <div class="formulier-groep">
          <label class="formulier-label">Score</label>
          <div class="uitslag-score-rij">
            <div class="uitslag-score-team">
              <div class="uitslag-score-naam">ASC Nieuwland 3</div>
              <input type="number" id="uitslag-score-eigen" class="formulier-input uitslag-score-input" min="0" placeholder="0">
            </div>
            <div class="uitslag-score-scheider">–</div>
            <div class="uitslag-score-team">
              <div class="uitslag-score-naam" id="uitslag-tegenstander-label">Tegenstander</div>
              <input type="number" id="uitslag-score-tegenstander" class="formulier-input uitslag-score-input" min="0" placeholder="0">
            </div>
          </div>
        </div>

        <!-- Doelpunten -->
        <div class="formulier-groep">
          <div class="event-sectie-header">
            <label class="formulier-label">Doelpunten</label>
            <button class="btn btn-sm btn-glas" id="voeg-doel-toe" style="padding:6px 12px;font-size:12px">+ Toevoegen</button>
          </div>
          <div id="doelpunten-lijst"></div>
        </div>

        <!-- Kaarten -->
        <div class="formulier-groep" style="margin-bottom:8px">
          <div class="event-sectie-header">
            <label class="formulier-label">Kaarten</label>
            <button class="btn btn-sm btn-glas" id="voeg-kaart-toe" style="padding:6px 12px;font-size:12px">+ Toevoegen</button>
          </div>
          <div id="kaarten-lijst"></div>
        </div>

        <div id="uitslag-fout" style="color:var(--rood);font-size:13px;font-weight:600;min-height:18px"></div>
      </div>
      <div class="modal-voet">
        <button class="btn btn-primair w-full" id="uitslag-opslaan-btn">Uitslag opslaan</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>controleerAuth();</script>
  <script src="js/nav.js"></script>
  <script src="js/wedstrijden.js"></script>
</body>
</html>
