<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a6b38">
  <title>Wedstrijden — ASC Nieuwland 3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="pagina-header">
      <div>
        <div class="pagina-titel">Wedstrijden</div>
        <div class="pagina-ondertitel">ASC Nieuwland 3</div>
      </div>
    </div>

    <!-- Tab switcher -->
    <div class="tab-switcher">
      <button class="tab-switch-item actief" data-tab="aankomend">📅 Aankomend</button>
      <button class="tab-switch-item" data-tab="gespeeld">🏆 Gespeeld</button>
    </div>

    <!-- Wedstrijd lijst -->
    <div id="wedstrijd-lijst">
      <div class="skeleton skeleton-kaart"></div>
      <div class="skeleton skeleton-kaart"></div>
      <div class="skeleton skeleton-kaart"></div>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fab-nieuw" title="Wedstrijd toevoegen">＋</button>

  <!-- Modal: Wedstrijd toevoegen / bewerken -->
  <div class="modal-overlay" id="wedstrijd-modal">
    <div class="modal-sheet">
      <div class="modal-handel"></div>
      <div class="modal-hoofd">
        <div class="modal-titel" id="modal-titel-tekst">Wedstrijd toevoegen</div>
        <button class="modal-sluiten" id="modal-sluiten">✕</button>
      </div>
      <div class="modal-inhoud">

        <div class="formulier-groep">
          <label class="formulier-label" for="form-tegenstander">Tegenstander</label>
          <input type="text" id="form-tegenstander" class="formulier-input" placeholder="Naam tegenstander" autocomplete="off">
        </div>

        <div class="formulier-groep">
          <label class="formulier-label" for="form-datum">Datum & tijd</label>
          <input type="datetime-local" id="form-datum" class="formulier-input">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="formulier-groep">
            <label class="formulier-label" for="form-thuis_uit">Thuis / Uit</label>
            <select id="form-thuis_uit" class="formulier-select">
              <option value="thuis">Thuis</option>
              <option value="uit">Uit</option>
            </select>
          </div>
          <div class="formulier-groep">
            <label class="formulier-label" for="form-status">Status</label>
            <select id="form-status" class="formulier-select">
              <option value="gepland">Gepland</option>
              <option value="gespeeld">Gespeeld</option>
            </select>
          </div>
        </div>

        <div class="formulier-groep">
          <label class="formulier-label" for="form-locatie">Locatie</label>
          <input type="text" id="form-locatie" class="formulier-input" placeholder="Veld / adres" autocomplete="off">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="formulier-groep">
            <label class="formulier-label" for="form-score_eigen">Score Nieuwland 3</label>
            <input type="number" id="form-score_eigen" class="formulier-input" placeholder="–" min="0" max="99">
          </div>
          <div class="formulier-groep">
            <label class="formulier-label" for="form-score_tegenstander">Score Tegenstander</label>
            <input type="number" id="form-score_tegenstander" class="formulier-input" placeholder="–" min="0" max="99">
          </div>
        </div>

        <div class="pin-fout" id="form-fout" style="font-size:13px;min-height:18px;margin-bottom:8px"></div>
      </div>
      <div class="modal-voet">
        <button class="btn btn-primair w-full" id="opslaan-btn">Opslaan</button>
        <button class="btn btn-gevaar" id="verwijder-btn" style="display:none;flex-shrink:0">🗑</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>controleerAuth();</script>
  <script src="js/nav.js"></script>
  <script src="js/wedstrijden.js"></script>
</body>
</html>
