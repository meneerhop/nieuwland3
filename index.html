<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a6b38">
  <title>Dashboard — ASC Nieuwland 3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <!-- Header -->
    <div class="pagina-header">
      <div>
        <div class="pagina-titel">Dashboard</div>
        <div class="pagina-ondertitel" id="dash-datum">Laden…</div>
      </div>
      <button class="btn btn-glas btn-sm" id="uitlog-btn" title="Uitloggen">🔒 Uitloggen</button>
    </div>

    <!-- Team header kaart -->
    <div class="glass-kaart dash-header">
      <div class="dash-header-rij">
        <div>
          <div class="dash-team-naam">ASC Nieuwland 3</div>
          <div style="font-size:13px;color:var(--inkt-zacht);margin-top:4px">Seizoen 2024/2025 · Zondag amateurs</div>
        </div>
        <div class="dash-badge">⚽</div>
      </div>
    </div>

    <!-- Snelle stats -->
    <div class="sectie-label">Seizoensoverzicht</div>
    <div class="stat-rij" id="snelle-stats">
      <div class="stat-pill"><div class="skeleton" style="height:32px;width:40px;margin:0 auto 8px"></div><div class="skeleton" style="height:10px;width:60px;margin:0 auto"></div></div>
      <div class="stat-pill"><div class="skeleton" style="height:32px;width:40px;margin:0 auto 8px"></div><div class="skeleton" style="height:10px;width:60px;margin:0 auto"></div></div>
      <div class="stat-pill"><div class="skeleton" style="height:32px;width:40px;margin:0 auto 8px"></div><div class="skeleton" style="height:10px;width:60px;margin:0 auto"></div></div>
    </div>

    <!-- Volgende wedstrijd -->
    <div class="sectie-label">Volgende wedstrijd</div>
    <div class="glass-kaart" id="volgende-wedstrijd">
      <div class="skeleton skeleton-kaart" style="margin:0;height:120px;border-radius:22px"></div>
    </div>

    <!-- Laatste uitslag -->
    <div class="sectie-label">Laatste uitslag</div>
    <div class="glass-kaart" id="laatste-uitslag">
      <div class="skeleton skeleton-kaart" style="margin:0;height:100px;border-radius:22px"></div>
    </div>

    <!-- Stand positie -->
    <div class="sectie-label">Klassering</div>
    <div class="glass-kaart" id="stand-positie">
      <div class="skeleton skeleton-kaart" style="margin:0;height:80px;border-radius:22px"></div>
    </div>

    <!-- Volgende training -->
    <div class="sectie-label">Volgende training</div>
    <div class="glass-kaart" id="volgende-training">
      <div class="skeleton skeleton-kaart" style="margin:0;height:80px;border-radius:22px"></div>
    </div>

    <!-- Snelkoppelingen -->
    <div class="sectie-label">Ga naar</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
      <a href="wedstrijden.html" class="glass-kaart klikbaar" style="padding:18px;display:flex;align-items:center;gap:12px;text-decoration:none">
        <span style="font-size:28px">⚽</span>
        <div>
          <div style="font-weight:700;font-size:15px;color:var(--inkt)">Wedstrijden</div>
          <div style="font-size:12px;color:var(--inkt-zacht)">Agenda & uitslagen</div>
        </div>
      </a>
      <a href="spelers.html" class="glass-kaart klikbaar" style="padding:18px;display:flex;align-items:center;gap:12px;text-decoration:none">
        <span style="font-size:28px">👥</span>
        <div>
          <div style="font-weight:700;font-size:15px;color:var(--inkt)">Spelers</div>
          <div style="font-size:12px;color:var(--inkt-zacht)">Selectie & stats</div>
        </div>
      </a>
      <a href="opstelling.html" class="glass-kaart klikbaar" style="padding:18px;display:flex;align-items:center;gap:12px;text-decoration:none">
        <span style="font-size:28px">📋</span>
        <div>
          <div style="font-weight:700;font-size:15px;color:var(--inkt)">Opstelling</div>
          <div style="font-size:12px;color:var(--inkt-zacht)">Formatie & veld</div>
        </div>
      </a>
      <a href="training.html" class="glass-kaart klikbaar" style="padding:18px;display:flex;align-items:center;gap:12px;text-decoration:none">
        <span style="font-size:28px">🏃</span>
        <div>
          <div style="font-weight:700;font-size:15px;color:var(--inkt)">Training</div>
          <div style="font-size:12px;color:var(--inkt-zacht)">Sessies & aanwezigheid</div>
        </div>
      </a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>controleerAuth();</script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
