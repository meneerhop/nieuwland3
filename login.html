<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#002E5F">
  <title>ASC Nieuwland 3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      padding-bottom: 0;
    }

    .login-pagina {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-kaart {
      width: 100%;
      max-width: 340px;
      padding: 36px 28px 32px;
      text-align: center;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 12px;
      object-fit: contain;
    }

    .login-team {
      font-size: 20px;
      font-weight: 800;
      color: var(--blauw);
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 14px;
      color: var(--inkt-zacht);
      margin-bottom: 28px;
    }

    /* PIN dots */
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .pin-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(0,46,95,0.30);
      background: transparent;
      transition: background 0.12s ease, transform 0.12s ease, border-color 0.12s ease;
    }

    .pin-dot.gevuld {
      background: var(--blauw);
      border-color: var(--blauw);
      transform: scale(1.12);
    }

    /* Keypad — ronde toetsen, lichte stijl */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .keypad-toets {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(0,46,95,0.08);
      border: 1px solid rgba(0,46,95,0.10);
      color: var(--inkt);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-family: var(--font);
      transition: background 0.1s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .keypad-toets:active,
    .keypad-toets.gedrukt {
      background: rgba(0,46,95,0.18);
      transform: scale(0.92);
    }

    .keypad-hoofdcijfer {
      font-size: 26px;
      font-weight: 300;
      line-height: 1;
      color: var(--inkt);
    }

    .keypad-letters {
      font-size: 7.5px;
      font-weight: 600;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--inkt-zacht);
      line-height: 1;
      margin-top: 2px;
    }

    .keypad-leeg { pointer-events: none; }

    .keypad-wis {
      background: transparent;
      border-color: transparent;
      font-size: 22px;
      color: var(--inkt-zacht);
    }
    .keypad-wis:active {
      background: rgba(0,46,95,0.08);
    }

    .pin-fout {
      font-size: 13px;
      font-weight: 600;
      color: var(--rood);
      margin-top: 14px;
      min-height: 18px;
    }

    @keyframes schudden {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-7px); }
      40%       { transform: translateX(7px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }
    .schud { animation: schudden 0.42s ease; }
  </style>
</head>
<body>
  <div class="login-pagina">
    <div class="glass-kaart login-kaart">

      <img class="login-logo" src="img/logo.png" alt="ASC Nieuwland" />
      <div class="login-team">ASC Nieuwland 3</div>
      <div class="login-sub">Voer de toegangscode in</div>

      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>

      <div class="keypad" id="keypad">
        <button class="keypad-toets" data-cijfer="1">
          <span class="keypad-hoofdcijfer">1</span>
        </button>
        <button class="keypad-toets" data-cijfer="2">
          <span class="keypad-hoofdcijfer">2</span>
          <span class="keypad-letters">ABC</span>
        </button>
        <button class="keypad-toets" data-cijfer="3">
          <span class="keypad-hoofdcijfer">3</span>
          <span class="keypad-letters">DEF</span>
        </button>
        <button class="keypad-toets" data-cijfer="4">
          <span class="keypad-hoofdcijfer">4</span>
          <span class="keypad-letters">GHI</span>
        </button>
        <button class="keypad-toets" data-cijfer="5">
          <span class="keypad-hoofdcijfer">5</span>
          <span class="keypad-letters">JKL</span>
        </button>
        <button class="keypad-toets" data-cijfer="6">
          <span class="keypad-hoofdcijfer">6</span>
          <span class="keypad-letters">MNO</span>
        </button>
        <button class="keypad-toets" data-cijfer="7">
          <span class="keypad-hoofdcijfer">7</span>
          <span class="keypad-letters">PQRS</span>
        </button>
        <button class="keypad-toets" data-cijfer="8">
          <span class="keypad-hoofdcijfer">8</span>
          <span class="keypad-letters">TUV</span>
        </button>
        <button class="keypad-toets" data-cijfer="9">
          <span class="keypad-hoofdcijfer">9</span>
          <span class="keypad-letters">WXYZ</span>
        </button>
        <div class="keypad-leeg"></div>
        <button class="keypad-toets" data-cijfer="0">
          <span class="keypad-hoofdcijfer">0</span>
        </button>
        <button class="keypad-toets keypad-wis" id="wis-btn">⌫</button>
      </div>

      <div class="pin-fout" id="pin-fout"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    const AUTH_KEY = "nieuwland3_pin";

    if (localStorage.getItem(AUTH_KEY) === SITE_PIN) {
      location.href = "index.html";
    }

    let ingevoerd = "";

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById("dot-" + i).classList.toggle("gevuld", i < ingevoerd.length);
      }
    }

    function controleerPin() {
      if (ingevoerd === SITE_PIN) {
        localStorage.setItem(AUTH_KEY, SITE_PIN);
        setTimeout(() => { location.href = "index.html"; }, 100);
      } else {
        const fout = document.getElementById("pin-fout");
        const dots = document.getElementById("pin-dots");
        fout.textContent = "Onjuiste code. Probeer opnieuw.";
        dots.classList.remove("schud");
        void dots.offsetHeight;
        dots.classList.add("schud");
        navigator.vibrate?.([60, 40, 60]);
        setTimeout(() => {
          ingevoerd = "";
          updateDots();
          fout.textContent = "";
          dots.classList.remove("schud");
        }, 900);
      }
    }

    function verwerkCijfer(c) {
      if (ingevoerd.length >= 4) return;
      navigator.vibrate?.(4);
      ingevoerd += c;
      updateDots();
      if (ingevoerd.length === 4) setTimeout(controleerPin, 90);
    }

    function wisLaatste() {
      if (!ingevoerd.length) return;
      ingevoerd = ingevoerd.slice(0, -1);
      updateDots();
      document.getElementById("pin-fout").textContent = "";
    }

    document.querySelectorAll(".keypad-toets").forEach(btn => {
      btn.addEventListener("touchstart",  () => btn.classList.add("gedrukt"),    { passive: true });
      btn.addEventListener("touchend",    () => btn.classList.remove("gedrukt"), { passive: true });
      btn.addEventListener("touchcancel", () => btn.classList.remove("gedrukt"), { passive: true });
    });

    document.querySelectorAll(".keypad-toets[data-cijfer]").forEach(btn => {
      btn.addEventListener("click", () => verwerkCijfer(btn.dataset.cijfer));
    });
    document.getElementById("wis-btn").addEventListener("click", wisLaatste);

    document.addEventListener("keydown", e => {
      if (e.key >= "0" && e.key <= "9") verwerkCijfer(e.key);
      else if (e.key === "Backspace") wisLaatste();
    });
  </script>
</body>
</html>
