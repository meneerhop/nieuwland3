<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a6b38">
  <title>Wedstrijd — ASC Nieuwland 3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="wrap">

    <!-- Terug -->
    <div style="margin-bottom:16px">
      <a href="wedstrijden.html" class="btn btn-glas" style="display:inline-flex;gap:6px;padding:10px 18px;font-size:14px">
        ← Terug
      </a>
    </div>

    <!-- Match header -->
    <div class="glass-kaart" id="wedstrijd-header" style="text-align:center;padding:28px 20px 24px">
      <div class="skeleton" style="height:14px;width:120px;margin:0 auto 16px"></div>
      <div class="skeleton" style="height:24px;width:220px;margin:0 auto 12px"></div>
      <div class="skeleton" style="height:48px;width:100px;margin:0 auto 12px"></div>
      <div class="skeleton" style="height:28px;width:180px;margin:0 auto"></div>
    </div>

    <!-- Details -->
    <div class="sectie-label">Details</div>
    <div class="glass-kaart" id="wedstrijd-details">
      <div style="padding:16px 20px">
        <div class="skeleton" style="height:14px;width:80%;margin-bottom:12px"></div>
        <div class="skeleton" style="height:14px;width:60%"></div>
      </div>
    </div>

    <!-- Verslag -->
    <div class="sectie-label" id="verslag-label">Verslag</div>
    <div id="verslag-sectie">
      <div class="skeleton skeleton-kaart" style="min-height:64px;border-radius:var(--radius)"></div>
    </div>

    <!-- Notities -->
    <div class="sectie-label" id="notities-label">Notities</div>
    <div id="notities-sectie">
      <div class="skeleton skeleton-kaart" style="min-height:64px;border-radius:var(--radius)"></div>
    </div>

    <!-- Beschikbaarheid -->
    <div class="sectie-label" id="beschikbaarheid-label">Beschikbaarheid</div>
    <div id="beschikbaarheid-sectie">
      <div class="skeleton skeleton-kaart" style="min-height:80px;border-radius:var(--radius)"></div>
    </div>

    <!-- Opstelling -->
    <div class="sectie-label">Opstelling</div>
    <div id="opstelling-sectie">
      <div class="skeleton skeleton-kaart" style="min-height:64px;border-radius:var(--radius)"></div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/config.local.js"></script>
  <script src="js/auth.js"></script>
  <script>controleerAuth();</script>
  <script src="js/nav.js"></script>
  <script src="js/wedstrijd.js"></script>
</body>
</html>
